<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="grok_1792261932370.jpg">
<title>Auto Gestió</title>
<style>
:root{--bg:#0b1220;--card:#151f32;--card2:#1d2a40;--text:#f4f7fb;--muted:#9eabc0;--blue:#3b82f6;--green:#22c55e;--orange:#f59e0b;--red:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{position:sticky;top:0;z-index:10;display:flex;gap:12px;align-items:center;padding:16px;background:rgba(11,18,32,.96);backdrop-filter:blur(10px);border-bottom:1px solid #26344d}header img{width:46px;height:46px;border-radius:12px;object-fit:cover}h1{font-size:22px;margin:0}main{max-width:760px;margin:auto;padding:16px 16px 110px}.hero{padding:4px 2px 16px}.hero h2{font-size:28px;margin:0 0 5px}.muted,small{color:var(--muted)}.card{background:var(--card);border:1px solid #26344d;border-radius:18px;padding:16px;margin-bottom:12px}.empty{text-align:center;padding:30px 16px;color:var(--muted)}button{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:15px;color:white;cursor:pointer}.primary{background:var(--blue)}.secondary{background:var(--card2)}.danger{background:#401b23;color:#ffb8c0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:110px}.vehicle{display:flex;gap:13px;align-items:center}.vehicle img{width:92px;height:70px;object-fit:cover;border-radius:12px;background:#202b3e}.vehicle h3{margin:0 0 4px}.tag{display:inline-block;background:#24324a;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:700;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.miniCard{background:#101a2c;border:1px solid #293951;border-radius:12px;padding:11px}.status{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #293951}.status:last-child{border-bottom:0}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #31415c;background:#0f1727;color:white;font-size:15px}textarea{min-height:105px;resize:vertical}input[type=file]{padding:9px}.preview{display:none;width:100%;max-height:190px;object-fit:cover;border-radius:13px;margin-top:9px}.detailPhoto{width:100%;max-height:240px;object-fit:cover;border-radius:15px;margin-bottom:12px}.obs{background:#101a2c;border:1px solid #2b3b57;border-radius:14px;padding:13px;margin-top:14px;white-space:pre-wrap;line-height:1.45}.notice{padding:10px 12px;border-radius:11px;background:#1c293e;color:#cbd5e1;font-size:12px;line-height:1.4;margin-top:10px}.manual{background:#101a2c;border:1px solid #2b3b57;border-radius:14px;padding:13px;margin-top:10px}.saved{margin-top:9px;padding:9px;border-radius:10px;background:#16243a}.saved a{color:#93c5fd;font-weight:700;text-decoration:none}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:10px 14px;background:rgba(11,18,32,.98);border-top:1px solid #26344d;display:flex;gap:8px}.bottom button{flex:1}.install{display:none;background:#172b49;border:1px solid #315b91;border-radius:14px;padding:13px;margin-bottom:12px}
</style>
</head>
<body>
<header><img src="grok_1792261932370.jpg" alt="Auto Gestió"><div><h1>Auto Gestió</h1><small>El control dels teus vehicles</small></div></header>
<main>
<div id="installBox" class="install"><b>📲 Instal·la Auto Gestió</b><div class="muted" style="font-size:13px;margin:5px 0 10px">Afegeix-la a la pantalla d'inici per utilitzar-la com una app.</div><div class="actions"><button class="primary" id="installBtn">Instal·lar</button><button class="secondary" id="installLater">Ara no</button></div></div>
<section class="hero"><h2>Els meus vehicles</h2><div class="muted">ITV · assegurança · revisions · manuals · fotografies · observacions</div></section>
<section id="vehicles"></section>
<section id="formCard" class="card" style="display:none">
<h3 id="formTitle">➕ Afegir vehicle</h3>
<form id="vehicleForm" autocomplete="off">
<label>Tipus</label><select id="type"><option>Cotxe</option><option>Moto</option><option>Furgoneta</option><option>Altres</option></select>
<label>Marca *</label><input id="brand" required placeholder="Ex. BMW">
<label>Model *</label><input id="model" required placeholder="Ex. X3 20d">
<label>Versió / motor</label><input id="engine" placeholder="Ex. 20d xDrive 190 CV">
<label>Any</label><input id="year" type="number" min="1950" max="2100" placeholder="2021">
<label>Matrícula</label><input id="plate" placeholder="1234 ABC">
<label>VIN / bastidor</label><input id="vin" maxlength="17" placeholder="17 caràcters">
<label>Quilometratge actual</label><input id="km" type="number" min="0" placeholder="68000">
<label>Etiqueta mediambiental</label><select id="eco"><option value="">Sense indicar</option><option>0 — Blau</option><option>ECO — Blau/verd</option><option>B — Groga</option><option>C — Verda</option><option>Sense distintiu</option><option>Desconeguda</option></select>
<label>📷 Fotografia</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview" alt="Vista prèvia">
<label>Data ITV</label><input id="itv" type="date">
<label>Data assegurança</label><input id="insurance" type="date">
<label>Periodicitat assegurança</label><select id="insuranceFrequency"><option value="annual">Anual</option><option value="monthly">Mensual</option></select>
<label>Pròxima revisió (km)</label><input id="serviceKm" type="number" min="0" placeholder="70000">
<label>Pròxima revisió (data)</label><input id="serviceDate" type="date">
<label>📝 Observacions</label><textarea id="observations" placeholder="Pneumàtics, sorolls, reparacions pendents, accessoris, incidències..."></textarea>
<div class="actions"><button class="primary" type="submit">💾 Guardar vehicle</button><button class="secondary" type="button" id="cancelBtn">Cancel·lar</button></div>
</form></section>
<section id="detail"></section>
</main>
<div class="bottom"><button class="primary" id="addBtn">＋ Afegir vehicle</button><button class="secondary" id="installBottom" style="display:none">📲 Instal·lar</button></div>
<script>
'use strict';
const KEY='autoGestioVehicles',MANUAL_KEY='autoGestioManuals';
let vehicles=load(KEY,[]),manuals=load(MANUAL_KEY,{}),editIndex=-1,pendingInstall=null;
const $=id=>document.getElementById(id);
function load(k,f){try{const x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function save(){localStorage.setItem(KEY,JSON.stringify(vehicles))}function saveManuals(){localStorage.setItem(MANUAL_KEY,JSON.stringify(manuals))}
function esc(x){return String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function dateText(d){return d?new Date(d+'T12:00:00').toLocaleDateString('ca-ES'):'—'}
function days(d){return d?Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000):null}
function status(d){const n=days(d);if(n===null)return '<span>—</span>';if(n<0)return '<span style="color:var(--red)">Vençut</span>';if(n<=30)return '<span style="color:var(--orange)">'+n+' dies</span>';return '<span style="color:var(--green)">'+n+' dies</span>'}
function render(){const el=$('vehicles');if(!vehicles.length){el.innerHTML='<div class="card empty">Encara no tens cap vehicle.<br><br>Prem <b>＋ Afegir vehicle</b> per començar.</div>';return}el.innerHTML=vehicles.map((v,i)=>'<div class="card"><div class="vehicle"><img src="'+(v.photo||'grok_1792261932370.jpg')+'"><div style="flex:1"><h3>'+esc(v.brand)+' '+esc(v.model)+'</h3><small>'+esc(v.type)+' · '+esc(v.plate||'Sense matrícula')+' · '+Number(v.km||0).toLocaleString('ca-ES')+' km</small><br><span class="tag">'+esc(v.eco||'Etiqueta pendent')+'</span></div></div><div class="grid" style="margin-top:12px"><div class="miniCard"><small>ITV</small><br>'+dateText(v.itv)+'<br>'+status(v.itv)+'</div><div class="miniCard"><small>Assegurança</small><br>'+dateText(v.insurance)+'<br>'+status(v.insurance)+'</div></div><div class="actions"><button class="primary" data-view="'+i+'">Veure fitxa</button><button class="secondary" data-edit="'+i+'">Editar</button><button class="danger" data-delete="'+i+'">Eliminar</button></div></div>').join('')}
function openForm(i=-1){editIndex=i;$('formTitle').textContent=i<0?'➕ Afegir vehicle':'✏️ Editar vehicle';$('formCard').style.display='block';$('detail').innerHTML='';const v=i>=0?vehicles[i]:{};['type','brand','model','engine','year','plate','vin','km','eco','itv','insurance','insuranceFrequency','serviceKm','serviceDate','observations'].forEach(k=>$(k).value=v[k]??(k==='insuranceFrequency'?'annual':''));$('preview').src=v.photo||'';$('preview').style.display=v.photo?'block':'none';$('photo').value='';$('formCard').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$(i<0?'brand':'model').focus(),150)}
function closeForm(){$('formCard').style.display='none';editIndex=-1;$('vehicleForm').reset();$('preview').style.display='none';$('preview').src=''}
$('photo').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(f.size>4*1024*1024){alert('La fotografia és massa gran. Tria una imatge de menys de 4 MB.');e.target.value='';return}const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').style.display='block'};r.readAsDataURL(f)});
$('vehicleForm').addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();const old=editIndex>=0?vehicles[editIndex]:{};const v={type:$('type').value,brand:$('brand').value.trim(),model:$('model').value.trim(),engine:$('engine').value.trim(),year:$('year').value,plate:$('plate').value.trim().toUpperCase(),vin:$('vin').value.trim().toUpperCase(),km:Number($('km').value||0),eco:$('eco').value,itv:$('itv').value,insurance:$('insurance').value,insuranceFrequency:$('insuranceFrequency').value,serviceKm:Number($('serviceKm').value||0),serviceDate:$('serviceDate').value,observations:$('observations').value.trim(),photo:old.photo||''};if(!v.brand||!v.model){alert('Falta indicar la marca i el model.');return}const f=$('photo').files?.[0];if(f){v.photo=await fileData(f)}if(editIndex>=0)vehicles[editIndex]=v;else vehicles.push(v);save();closeForm();render();alert(editIndex>=0?'Vehicle actualitzat correctament.':'Vehicle guardat correctament.');});
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
$('cancelBtn').addEventListener('click',closeForm);$('addBtn').addEventListener('click',()=>openForm());
$('vehicles').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const i=Number(b.dataset.view??b.dataset.edit??b.dataset.delete);if(b.dataset.view!==undefined)openVehicle(i);else if(b.dataset.edit!==undefined)openForm(i);else if(b.dataset.delete!==undefined)removeVehicle(i)});
function removeVehicle(i){if(!confirm('Vols eliminar aquest vehicle?'))return;vehicles.splice(i,1);save();render();$('detail').innerHTML=''}
function openVehicle(i){const v=vehicles[i];const m=manuals[i]||{};$('detail').innerHTML='<div class="card">'+(v.photo?'<img class="detailPhoto" src="'+v.photo+'">':'')+'<h3>🚗 '+esc(v.brand)+' '+esc(v.model)+'</h3><div class="status"><span>Tipus</span><b>'+esc(v.type)+'</b></div><div class="status"><span>Motor</span><b>'+esc(v.engine||'—')+'</b></div><div class="status"><span>Any</span><b>'+esc(v.year||'—')+'</b></div><div class="status"><span>Matrícula</span><b>'+esc(v.plate||'—')+'</b></div><div class="status"><span>VIN</span><b>'+esc(v.vin||'—')+'</b></div><div class="status"><span>Quilometratge</span><b>'+Number(v.km||0).toLocaleString('ca-ES')+' km</b></div><div class="status"><span>Etiqueta</span><b>'+esc(v.eco||'—')+'</b></div><div class="status"><span>ITV</span><b>'+dateText(v.itv)+' · '+status(v.itv)+'</b></div><div class="status"><span>Assegurança</span><b>'+dateText(v.insurance)+' · '+status(v.insurance)+'</b></div><div class="status"><span>Periodicitat</span><b>'+(v.insuranceFrequency==='monthly'?'Mensual':'Anual')+'</b></div><div class="status"><span>Pròxima revisió</span><b>'+esc(v.serviceKm||'—')+' km · '+dateText(v.serviceDate)+'</b></div><div class="obs"><b>📝 Observacions</b><div style="margin-top:7px">'+(v.observations?esc(v.observations):'<span class="muted">Sense observacions.</span>')+'</div></div><div class="actions"><button class="primary" onclick="openForm('+i+')">✏️ Editar</button><button class="secondary" onclick="openOfficial('+i+')">🔧 Font oficial</button></div><div class="manual"><h3>📖 Manual d'usuari</h3><p class="muted">Busca la documentació oficial per marca, model, motor i any.</p>'+(m.user?'<div class="saved"><a href="'+esc(m.user)+'" target="_blank" rel="noopener">📄 Obrir manual guardat</a></div>':'')+'<div class="actions"><button class="primary" onclick="searchManual('+i+',\'user\')">🔎 Cercar</button><button class="secondary" onclick="saveManual('+i+',\'user\')">💾 Guardar enllaç</button></div></div><div class="manual"><h3>🔧 Manual de manteniment</h3><p class="muted">Programa de revisions i operacions del fabricant.</p>'+(m.maintenance?'<div class="saved"><a href="'+esc(m.maintenance)+'" target="_blank" rel="noopener">📄 Obrir manteniment guardat</a></div>':'')+'<div class="actions"><button class="primary" onclick="searchManual('+i+',\'maintenance\')">🔎 Cercar</button><button class="secondary" onclick="saveManual('+i+',\'maintenance\')">💾 Guardar enllaç</button></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="closeDetail()">← Tornar</button></div>'; $('detail').scrollIntoView({behavior:'smooth'})}
function closeDetail(){$('detail').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}
function domain(v){const d={Toyota:'toyota.es',Ford:'ford.es',Volkswagen:'volkswagen.es',SEAT:'seat.es',Skoda:'skoda.es',BMW:'bmw.es',Mercedes:'mercedes-benz.es',Nissan:'nissan.es',Hyundai:'hyundai.com/es/es',Kia:'kia.com/es',Audi:'audi.es',Renault:'renault.es',Peugeot:'peugeot.es',Citroen:'citroen.es',Opel:'opel.es',Honda:'honda.es',Yamaha:'yamaha-motor.eu',Suzuki:'suzuki.es',Kawasaki:'kawasaki.es',Mazda:'mazda.es',Volvo:'volvocars.com/es',Dacia:'dacia.es'};return Object.keys(d).find(k=>k.toLowerCase()===String(v.brand).toLowerCase())?d[Object.keys(d).find(k=>k.toLowerCase()===String(v.brand).toLowerCase())]:''}
function openOfficial(i){const v=vehicles[i],d=domain(v);if(d)window.open('https://www.google.com/search?q='+encodeURIComponent('site:'+d+' '+v.brand+' '+v.model+' '+(v.engine||'')+' manteniment revisió'),'_blank','noopener');else alert('Encara no tenim la font oficial preparada per aquesta marca. Pots cercar el manual des de la fitxa.')}
function searchManual(i,type){const v=vehicles[i],d=domain(v),q=(d?'site:'+d+' ':'')+[v.brand,v.model,v.engine,v.year,v.vin].filter(Boolean).join(' ')+' '+(type==='user'?'manual de usuario PDF':'manual mantenimiento programa revisiones PDF');window.open('https://www.google.com/search?q='+encodeURIComponent(q),'_blank','noopener')}
function saveManual(i,type){const u=prompt('Enganxa aquí l’enllaç oficial del manual:');if(!u||!/^https?:\/\//i.test(u))return;manuals[i]=manuals[i]||{};manuals[i][type]=u;saveManuals();openVehicle(i)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pendingInstall=e;$('installBox').style.display='block';$('installBottom').style.display='block'});$('installBtn').addEventListener('click',install);$('installBottom').addEventListener('click',install);$('installLater').addEventListener('click',()=>{$('installBox').style.display='none'});async function install(){if(!pendingInstall)return;pendingInstall.prompt();await pendingInstall.userChoice;pendingInstall=null;$('installBox').style.display='none';$('installBottom').style.display='none'}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script>
</body>
</html>
