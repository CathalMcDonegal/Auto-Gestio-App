<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="grok_1792261932370.jpg"><title>Auto Gestió</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:13px 15px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #26344d;position:sticky;top:0;background:#0b1220;z-index:20}header img{width:42px;height:42px;border-radius:12px;object-fit:cover}h1,h2,h3{margin:0 0 7px}main{max-width:850px;margin:auto;padding:13px 13px 88px}.muted{color:#9eabc0}.card{background:#151f32;border:1px solid #26344d;border-radius:16px;padding:14px;margin-bottom:11px}.hero{display:flex;justify-content:space-between;gap:9px;align-items:center}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.mini{background:#101a2c;border-radius:11px;padding:10px}.mini b{font-size:20px}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:9px 0}.tabs button{padding:9px 3px;font-size:11px}.tab{display:none}.tab.active{display:block}.vehicle{display:flex;gap:11px;align-items:center}.vehicle img{width:86px;height:68px;object-fit:cover;border-radius:12px}.tag{display:inline-block;background:#26344d;border-radius:99px;padding:4px 8px;font-size:12px;margin-top:4px}button{border:0;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:700;color:white;background:#2563eb}.secondary{background:#24324a}.danger{background:#5a2028}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.actions button{flex:1;min-width:100px}label{display:block;color:#9eabc0;font-size:13px;margin:10px 0 5px}input,select,textarea{width:100%;padding:12px;border-radius:11px;border:1px solid #31415c;background:#0f1727;color:white;font-size:15px}textarea{min-height:85px}.photo{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-top:7px}.status{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #293951}.obs{margin-top:11px;background:#101a2c;border-radius:12px;padding:11px;white-space:pre-wrap}.ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}.empty{text-align:center;padding:27px;color:#9eabc0}.hidden{display:none!important}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid #26344d;padding:8px 12px;z-index:30}.bottom button{width:100%}.due{border-left:4px solid #f59e0b}.over{border-left:4px solid #ef4444}.safe{border-left:4px solid #22c55e}.small{font-size:12px}.link{color:#7db2ff;text-decoration:none}.install{display:none}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#101a2c;border-radius:8px;min-height:54px;padding:5px;font-size:11px}.day b{font-size:12px}.event{display:block;margin-top:3px;padding:2px 3px;border-radius:4px;background:#263f68;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event.red{background:#5a2028}.event.yellow{background:#5a4920}
</style></head>
<body>
<header><img src="grok_1792261932370.jpg" alt="Auto Gestió"><div><h1>Auto Gestió</h1><div class="muted">El teu llibre digital del vehicle</div></div><button id="install" class="install secondary">Instal·lar</button></header>
<main>
<section class="card hero"><div><h2>Panell de control</h2><div class="muted">Revisions, ITV, assegurança, despeses i historial.</div></div><button id="add">＋ Vehicle</button></section>
<section id="dashboard" class="card"></section>
<div class="tabs"><button data-tab="vehicles">🚗 Vehicles</button><button data-tab="tasks">🔧 Què toca</button><button data-tab="history">📋 Historial</button><button data-tab="calendar">🗓️ Calendari</button><button data-tab="docs">📘 Manuals</button></div>
<section id="vehicles" class="tab active"></section><section id="tasks" class="tab"></section><section id="history" class="tab"></section><section id="calendar" class="tab"></section><section id="docs" class="tab"></section>
<section id="form" class="card hidden"><h2 id="formTitle">➕ Afegir vehicle</h2><form id="vehicleForm">
<label>Tipus</label><select id="type"><option>Cotxe</option><option>Moto</option><option>Furgoneta</option><option>Altres</option></select><label>Marca *</label><input id="brand" required><label>Model *</label><input id="model" required><label>Versió / motor</label><input id="engine"><label>Any</label><input id="year" type="number" min="1950" max="2100"><label>Matrícula</label><input id="plate"><label>VIN / bastidor</label><input id="vin" maxlength="17"><label>Quilometratge actual</label><input id="km" type="number" min="0" value="0"><label>Etiqueta mediambiental</label><select id="eco"><option value="">Sense indicar</option><option>0 — Blau</option><option>ECO — Blau/verd</option><option>B — Groga</option><option>C — Verda</option><option>Sense distintiu</option><option>Desconeguda</option></select><label>📷 Fotografia</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photo hidden"><label>Data ITV</label><input id="itv" type="date"><label>Data assegurança</label><input id="insurance" type="date"><label>Periodicitat assegurança</label><select id="insuranceFrequency"><option value="annual">Anual</option><option value="monthly">Mensual</option></select><label>Pròxima revisió (km)</label><input id="serviceKm" type="number" min="0"><label>Pròxima revisió (data)</label><input id="serviceDate" type="date"><label>📝 Observacions</label><textarea id="observations" placeholder="Reparacions pendents, sorolls, pneumàtics, accessoris..."></textarea><div class="actions"><button>💾 Guardar vehicle</button><button type="button" class="secondary" id="cancel">Cancel·lar</button></div></form></section>
<section id="detail"></section>
<section id="maintenanceForm" class="card hidden"><h2>🔧 Registrar manteniment</h2><form id="mForm"><label>Vehicle</label><select id="mVehicle"></select><label>Data</label><input id="mDate" type="date" required><label>Quilometratge</label><input id="mKm" type="number" min="0"><label>Treball realitzat</label><input id="mWork" placeholder="Revisió, oli, frens..."><label>Cost (€)</label><input id="mCost" type="number" min="0" step="0.01"><label>Taller</label><input id="mShop"><label>Observacions</label><textarea id="mObs"></textarea><div class="actions"><button>Guardar manteniment</button><button type="button" class="secondary" id="mCancel">Cancel·lar</button></div></form></section>
</main><div class="bottom"><button id="bottomAdd">＋ Afegir vehicle</button></div>
<script src="maintenance-sources.js"></script><script>
'use strict';
if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if('caches'in window)caches.keys().then(ks=>Promise.all(ks.filter(k=>k.indexOf('auto-gestio-')===0).map(k=>caches.delete(k)))).catch(()=>{});
const VKEY='autoGestioVehicles',HKEY='autoGestioMaintenance',DKEY='autoGestioDocuments';let vehicles=[],history=[],docs=[],edit=-1,photoData='',deferredInstall=null;const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{vehicles=JSON.parse(localStorage.getItem(VKEY)||'[]');if(!Array.isArray(vehicles))vehicles=[]}catch(e){vehicles=[]}try{history=JSON.parse(localStorage.getItem(HKEY)||'[]');if(!Array.isArray(history))history=[]}catch(e){history=[]}try{docs=JSON.parse(localStorage.getItem(DKEY)||'[]');if(!Array.isArray(docs))docs=[]}catch(e){docs=[]}
function save(){try{localStorage.setItem(VKEY,JSON.stringify(vehicles));localStorage.setItem(HKEY,JSON.stringify(history));localStorage.setItem(DKEY,JSON.stringify(docs));return true}catch(e){alert('No s’ha pogut guardar. Potser l’emmagatzematge està ple.');return false}}
const fmtDate=d=>d?new Date(d+'T12:00:00').toLocaleDateString('ca-ES'):'—';function days(d){if(!d)return null;return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}function ds(d){let n=days(d);if(n===null)return '<span>—</span>';return n<0?'<span class="bad">Vençut</span>':n<=30?'<span class="warn">'+n+' dies</span>':'<span class="ok">'+n+' dies</span>'}function vn(v){return esc(v.brand)+' '+esc(v.model)+(v.plate?' · '+esc(v.plate):'')}
function allDue(v){let a=[];[['ITV',v.itv],['Assegurança',v.insurance],['Revisió',v.serviceDate]].forEach(x=>{let n=days(x[1]);if(n!==null)a.push({name:x[0],date:x[1],days:n})});return a}
function renderDashboard(){let due=0,over=0;vehicles.forEach(v=>allDue(v).forEach(x=>{if(x.days<0)over++;else if(x.days<=30)due++}));let cost=history.reduce((a,h)=>a+Number(h.cost||0),0);$('dashboard').innerHTML='<div class="grid3"><div class="mini"><small>Vehicles</small><br><b>'+vehicles.length+'</b></div><div class="mini"><small>Pròxims 30 dies</small><br><b class="warn">'+due+'</b></div><div class="mini"><small>Vençuts</small><br><b class="bad">'+over+'</b></div></div><div style="margin-top:9px" class="muted">💶 Manteniment registrat: <b>'+cost.toLocaleString('ca-ES',{minimumFractionDigits:2})+' €</b></div>'}
function renderVehicles(){if(!vehicles.length){$('vehicles').innerHTML='<div class="card empty">No tens cap vehicle. Prem <b>＋ Vehicle</b> per començar.</div>';return}$('vehicles').innerHTML=vehicles.map((v,i)=>'<div class="card"><div class="vehicle"><img src="'+(v.photo||'grok_1792261932370.jpg')+'"><div><h3>'+vn(v)+'</h3><div class="muted">'+esc(v.type)+' · '+Number(v.km||0).toLocaleString('ca-ES')+' km</div><span class="tag">'+esc(v.eco||'Etiqueta pendent')+'</span></div></div><div class="grid"><div class="mini"><small>ITV</small><br>'+fmtDate(v.itv)+' · '+ds(v.itv)+'</div><div class="mini"><small>Assegurança</small><br>'+fmtDate(v.insurance)+' · '+ds(v.insurance)+'</div><div class="mini"><small>Revisió</small><br>'+(v.serviceKm?Number(v.serviceKm).toLocaleString('ca-ES')+' km':'—')+'<br>'+fmtDate(v.serviceDate)+'</div><div class="mini"><small>Observacions</small><br>'+esc((v.observations||'—').slice(0,55))+'</div></div><div class="actions"><button data-view="'+i+'">Fitxa</button><button class="secondary" data-edit="'+i+'">Editar</button><button class="danger" data-del="'+i+'">Eliminar</button></div></div>').join('')}
function renderTasks(){let html='<div class="card"><h2>🔧 Què toca fer ara</h2><div class="muted">Avisos calculats amb les dades del vehicle. Els intervals de fabricant només s’afegeixen quan hi ha una font fiable.</div></div>';if(!vehicles.length){$('tasks').innerHTML=html+'<div class="card empty">Afegeix un vehicle.</div>';return}vehicles.forEach((v,i)=>{let a=allDue(v).filter(x=>x.days<=60).sort((x,y)=>x.days-y.days),source=window.AUTO_GESTIO_MAINTENANCE_SOURCES?.[v.brand];html+='<div class="card '+(a.some(x=>x.days<0)?'over':a.length?'due':'safe')+'"><h3>'+vn(v)+'</h3>'+(a.length?a.map(x=>'<div class="status"><span>'+x.name+'</span><b>'+fmtDate(x.date)+' · '+ds(x.date)+'</b></div>').join(''):'<div class="ok">No hi ha venciments introduïts dins dels propers 60 dies.</div>')+(v.serviceKm&&Number(v.km)>=Number(v.serviceKm)?'<div class="status"><span>🔧 Revisió per km</span><b class="bad">'+Number(v.km).toLocaleString('ca-ES')+' / '+Number(v.serviceKm).toLocaleString('ca-ES')+' km</b></div>':'')+(source?'<div class="actions"><button data-source="'+esc(source.url)+'">📘 Manteniment oficial '+esc(v.brand)+'</button><button class="secondary" data-manual="'+i+'">🔎 Cercar manual</button></div>':'')+'<div class="actions"><button class="secondary" data-maint="'+i+'">＋ Registrar manteniment</button></div></div>'});$('tasks').innerHTML=html}
function renderHistory(){let total=history.reduce((a,h)=>a+Number(h.cost||0),0);let html='<div class="card hero"><div><h2>📋 Historial</h2><div class="muted">Manteniments, costos i tallers.</div></div><button id="addMaint">＋ Afegir</button></div><div class="card"><b>Total registrat: '+total.toLocaleString('ca-ES',{minimumFractionDigits:2})+' €</b></div>';if(!history.length)html+='<div class="card empty">Encara no hi ha manteniments registrats.</div>';history.slice().reverse().forEach((h,ri)=>{let v=vehicles[h.vehicleIndex];html+='<div class="card"><h3>'+esc(h.work||'Manteniment')+'</h3><div class="muted">'+(v?vn(v):'Vehicle eliminat')+' · '+fmtDate(h.date)+' · '+Number(h.km||0).toLocaleString('ca-ES')+' km</div><div class="status"><span>Taller</span><b>'+esc(h.shop||'—')+'</b></div><div class="status"><span>Cost</span><b>'+Number(h.cost||0).toLocaleString('ca-ES',{minimumFractionDigits:2})+' €</b></div>'+(h.obs?'<div class="obs">'+esc(h.obs)+'</div>':'')+'</div>'});$('history').innerHTML=html;let b=$('addMaint');if(b)b.onclick=openMaint}
function renderCalendar(){let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),start=first.getDay()||7,last=new Date(y,m+1,0).getDate(),names=['Dl','Dt','Dc','Dj','Dv','Ds','Dg'];let html='<div class="card"><h2>🗓️ '+now.toLocaleDateString('ca-ES',{month:'long',year:'numeric'})+'</h2><div class="calendar">'+names.map(n=>'<div class="small"><b>'+n+'</b></div>').join('');for(let i=1;i<start;i++)html+='<div class="day"></div>';for(let d=1;d<=last;d++){let iso=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'),ev=[];vehicles.forEach(v=>{[['ITV',v.itv],['Asseg.',v.insurance],['Rev.',v.serviceDate]].forEach(x=>{if(x[1]===iso)ev.push(x[0]+' '+v.brand)});});html+='<div class="day"><b>'+d+'</b>'+ev.map(e=>'<span class="event '+(d<now.getDate()?'red':'yellow')+'">'+esc(e)+'</span>').join('')+'</div>'}html+='</div></div>';html+='<div class="card"><b>📌 Properes dates</b>';let ev=[];vehicles.forEach(v=>allDue(v).forEach(x=>{if(x.days>=-7&&x.days<=90)ev.push({x,v})}));ev.sort((a,b)=>a.x.days-b.x.days);html+=ev.length?ev.map(e=>'<div class="status"><span>'+esc(e.x.name)+' · '+vn(e.v)+'</span><b>'+fmtDate(e.x.date)+'</b></div>').join(''):'<div class="muted" style="margin-top:8px">No hi ha dates dins dels propers 90 dies.</div>';html+='</div>';$('calendar').innerHTML=html}
function renderDocs(){let html='<div class="card"><h2>📘 Manuals i fonts oficials</h2><div class="muted">La cerca prioritza el fabricant. Els intervals exactes depenen de model, motor, any i ús.</div></div>';if(!vehicles.length){$('docs').innerHTML=html+'<div class="card empty">Afegeix un vehicle.</div>';return}vehicles.forEach((v,i)=>{let s=window.AUTO_GESTIO_MAINTENANCE_SOURCES?.[v.brand],q=encodeURIComponent(v.brand+' '+v.model+' '+(v.engine||'')+' '+(v.year||'')+' manual usuario mantenimiento PDF');html+='<div class="card"><h3>'+vn(v)+'</h3><div class="muted">Motor: '+esc(v.engine||'—')+' · Any: '+esc(v.year||'—')+'</div><div class="actions">'+(s?'<button data-source="'+esc(s.url)+'">🌐 Font oficial</button>':'')+'<button class="secondary" data-search="'+q+'">🔎 Cercar manual</button></div>';let vd=docs.filter(d=>d.vehicleIndex===i);if(vd.length)html+='<div class="obs"><b>Documents guardats</b>'+vd.map((d,j)=>'<div class="status"><a class="link" href="'+esc(d.url)+'" target="_blank" rel="noopener">'+esc(d.name)+'</a><button class="danger" data-docdel="'+docs.indexOf(d)+'">×</button></div>').join('')+'</div>';html+='</div>'});$('docs').innerHTML=html}
function renderAll(){renderDashboard();renderVehicles();renderTasks();renderHistory();renderCalendar();renderDocs()}
function openForm(i){edit=i;let v=i>=0?vehicles[i]:{};$('formTitle').textContent=i>=0?'✏️ Editar vehicle':'➕ Afegir vehicle';$('form').classList.remove('hidden');[['type','type'],['brand','brand'],['model','model'],['engine','engine'],['year','year'],['plate','plate'],['vin','vin'],['km','km'],['eco','eco'],['itv','itv'],['insurance','insurance'],['insuranceFrequency','insuranceFrequency'],['serviceKm','serviceKm'],['serviceDate','serviceDate'],['observations','observations']].forEach(x=>$(x[0]).value=v[x[1]]??(x[0]==='type'?'Cotxe':x[0]==='km'?0:x[0]==='insuranceFrequency'?'annual':''));photoData=v.photo||'';$('preview').src=photoData;$('preview').classList.toggle('hidden',!photoData);$('form').scrollIntoView({behavior:'smooth',block:'start'})}
function closeForm(){edit=-1;photoData='';$('form').classList.add('hidden');$('vehicleForm').reset();$('km').value=0;$('preview').classList.add('hidden')}
$('add').onclick=$('bottomAdd').onclick=()=>openForm(-1);$('cancel').onclick=closeForm;$('photo').onchange=e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>4*1024*1024){alert('La foto ha de pesar menys de 4 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{photoData=r.result;$('preview').src=photoData;$('preview').classList.remove('hidden')};r.readAsDataURL(f)};
$('vehicleForm').onsubmit=e=>{e.preventDefault();let v={type:$('type').value,brand:$('brand').value.trim(),model:$('model').value.trim(),engine:$('engine').value.trim(),year:$('year').value,plate:$('plate').value.trim().toUpperCase(),vin:$('vin').value.trim().toUpperCase(),km:Number($('km').value||0),eco:$('eco').value,photo:photoData,itv:$('itv').value,insurance:$('insurance').value,insuranceFrequency:$('insuranceFrequency').value,serviceKm:Number($('serviceKm').value||0),serviceDate:$('serviceDate').value,observations:$('observations').value.trim()};if(!v.brand||!v.model){alert('Has d’indicar marca i model.');return}if(edit>=0)vehicles[edit]=v;else vehicles.push(v);if(save()){closeForm();renderAll()}};
function detail(i){let v=vehicles[i],src=window.AUTO_GESTIO_MAINTENANCE_SOURCES?.[v.brand];$('detail').innerHTML='<div class="card">'+(v.photo?'<img class="photo" src="'+v.photo+'">':'')+'<h2>🚗 '+vn(v)+'</h2>'+[['Tipus',v.type],['Motor',v.engine],['Any',v.year],['Matrícula',v.plate],['VIN',v.vin],['Quilometratge',Number(v.km||0).toLocaleString('ca-ES')+' km'],['Etiqueta',v.eco],['ITV',fmtDate(v.itv)+' · '+ds(v.itv)],['Assegurança',fmtDate(v.insurance)+' · '+ds(v.insurance)],['Pròxima revisió',(v.serviceKm?Number(v.serviceKm).toLocaleString('ca-ES')+' km · ':'')+fmtDate(v.serviceDate)]].map(x=>'<div class="status"><span>'+esc(x[0])+'</span><b>'+esc(x[1]||'—')+'</b></div>').join('')+'<div class="obs"><b>📝 Observacions</b><br>'+esc(v.observations||'Sense observacions.')+'</div><div class="actions"><button data-detail-edit="'+i+'">✏️ Editar</button><button class="secondary" data-maint="'+i+'">＋ Manteniment</button>'+(src?'<button class="secondary" data-source="'+esc(src.url)+'">📘 Font oficial</button>':'')+'</div></div>';$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('vehicles').onclick=e=>{let b=e.target.closest('button');if(!b)return;let i=Number(b.dataset.view??b.dataset.edit??b.dataset.del);if(b.dataset.view!==undefined)detail(i);else if(b.dataset.edit!==undefined)openForm(i);else if(b.dataset.del!==undefined&&confirm('Vols eliminar aquest vehicle?')){vehicles.splice(i,1);history=history.filter(h=>h.vehicleIndex!==i).map(h=>({...h,vehicleIndex:h.vehicleIndex>i?h.vehicleIndex-1:h.vehicleIndex}));docs=docs.filter(d=>d.vehicleIndex!==i).map(d=>({...d,vehicleIndex:d.vehicleIndex>i?d.vehicleIndex-1:d.vehicleIndex}));save();$('detail').innerHTML='';renderAll()}};
$('detail').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.detailEdit!==undefined)openForm(Number(b.dataset.detailEdit));else if(b.dataset.maint!==undefined)openMaint(Number(b.dataset.maint));else if(b.dataset.source)window.open(b.dataset.source,'_blank')};
function openMaint(i=0){if(!vehicles.length){alert('Primer afegeix un vehicle.');return}$('maintenanceForm').classList.remove('hidden');$('mVehicle').innerHTML=vehicles.map((v,j)=>'<option value="'+j+'">'+vn(v)+'</option>').join('');$('mVehicle').value=String(i);$('mDate').value=new Date().toISOString().slice(0,10);$('mKm').value=vehicles[i]?.km||0;$('maintenanceForm').scrollIntoView({behavior:'smooth'})}
$('mCancel').onclick=()=>$('maintenanceForm').classList.add('hidden');$('mForm').onsubmit=e=>{e.preventDefault();let i=Number($('mVehicle').value),km=Number($('mKm').value||0);history.push({vehicleIndex:i,date:$('mDate').value,km,work:$('mWork').value.trim(),cost:Number($('mCost').value||0),shop:$('mShop').value.trim(),obs:$('mObs').value.trim()});if(km>Number(vehicles[i].km||0))vehicles[i].km=km;if(save()){$('mForm').reset();$('maintenanceForm').classList.add('hidden');renderAll()}};
$('tasks').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.source)window.open(b.dataset.source,'_blank');else if(b.dataset.maint!==undefined)openMaint(Number(b.dataset.maint));else if(b.dataset.manual!==undefined){let v=vehicles[Number(b.dataset.manual)];window.open('https://www.google.com/search?q='+encodeURIComponent(v.brand+' '+v.model+' '+(v.engine||'')+' '+(v.year||'')+' manual mantenimiento oficial PDF'),'_blank')}};
$('docs').onclick=e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.source)window.open(b.dataset.source,'_blank');else if(b.dataset.search)window.open('https://www.google.com/search?q='+b.dataset.search,'_blank');else if(b.dataset.docdel!==undefined){docs.splice(Number(b.dataset.docdel),1);save();renderDocs()}};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active');renderAll()});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('install').style.display='block'});$('install').onclick=async()=>{if(!deferredInstall)return;deferredInstall.prompt();deferredInstall=null;$('install').style.display='none'};
renderAll();
</script></body></html>
