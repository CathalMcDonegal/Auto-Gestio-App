<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="grok_1792261932370.jpg">
<title>Auto Gestió</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7fb;font-family:system-ui,-apple-system,Segoe UI,sans-serif}header{padding:15px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #26344d;position:sticky;top:0;background:#0b1220;z-index:5}header img{width:44px;height:44px;border-radius:12px;object-fit:cover}h1,h2,h3{margin:0 0 8px}main{max-width:760px;margin:auto;padding:16px 16px 100px}.muted{color:#9eabc0}.card{background:#151f32;border:1px solid #26344d;border-radius:16px;padding:16px;margin-bottom:12px}.empty{text-align:center;padding:30px;color:#9eabc0}button{border:0;border-radius:12px;padding:13px 15px;font-size:15px;font-weight:700;color:white;background:#2563eb}.secondary{background:#24324a}.danger{background:#5a2028}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions button{flex:1;min-width:110px}label{display:block;color:#9eabc0;font-size:13px;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #31415c;background:#0f1727;color:white;font-size:15px}textarea{min-height:100px}.photo{width:100%;max-height:230px;object-fit:cover;border-radius:14px;margin-top:8px}.vehicle{display:flex;gap:12px;align-items:center}.vehicle img{width:90px;height:70px;object-fit:cover;border-radius:12px}.tag{display:inline-block;background:#26344d;border-radius:99px;padding:5px 9px;font-size:12px;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.mini{background:#101a2c;border-radius:10px;padding:10px}.status{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #293951}.obs{margin-top:14px;background:#101a2c;border-radius:12px;padding:12px;white-space:pre-wrap}.bottom{position:fixed;bottom:0;left:0;right:0;background:#0b1220;border-top:1px solid #26344d;padding:10px 14px;z-index:10}.bottom button{width:100%}.hidden{display:none!important}.ok{color:#22c55e}.warn{color:#f59e0b}.bad{color:#ef4444}
</style>
</head>
<body>
<header><img src="grok_1792261932370.jpg" alt="Auto Gestió"><div><h1>Auto Gestió</h1><div class="muted">Control dels teus vehicles</div></div></header>
<main>
<section class="card"><h2>Els meus vehicles</h2><div class="muted">ITV · assegurança · revisions · foto · observacions</div></section>
<section id="list"></section>
<section id="form" class="card hidden">
<h2 id="formTitle">➕ Afegir vehicle</h2>
<form id="vehicleForm">
<label>Tipus</label><select id="type"><option>Cotxe</option><option>Moto</option><option>Furgoneta</option><option>Altres</option></select>
<label>Marca *</label><input id="brand" required>
<label>Model *</label><input id="model" required>
<label>Versió / motor</label><input id="engine">
<label>Any</label><input id="year" type="number" min="1950" max="2100">
<label>Matrícula</label><input id="plate">
<label>VIN / bastidor</label><input id="vin" maxlength="17">
<label>Quilometratge actual</label><input id="km" type="number" min="0" value="0">
<label>Etiqueta mediambiental</label><select id="eco"><option value="">Sense indicar</option><option>0 — Blau</option><option>ECO — Blau/verd</option><option>B — Groga</option><option>C — Verda</option><option>Sense distintiu</option><option>Desconeguda</option></select>
<label>📷 Fotografia</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photo hidden">
<label>Data ITV</label><input id="itv" type="date">
<label>Data assegurança</label><input id="insurance" type="date">
<label>Periodicitat assegurança</label><select id="insuranceFrequency"><option value="annual">Anual</option><option value="monthly">Mensual</option></select>
<label>Pròxima revisió (km)</label><input id="serviceKm" type="number" min="0">
<label>Pròxima revisió (data)</label><input id="serviceDate" type="date">
<label>📝 Observacions</label><textarea id="observations" placeholder="Reparacions pendents, sorolls, pneumàtics, accessoris..."></textarea>
<div class="actions"><button type="submit">💾 Guardar vehicle</button><button type="button" class="secondary" id="cancel">Cancel·lar</button></div>
</form></section>
<section id="detail"></section>
</main>
<div class="bottom"><button id="add">＋ Afegir vehicle</button></div>
<script>
'use strict';
// Aquesta versió no registra cap Service Worker. També elimina els antics perquè l'app no quedi atrapada en una versió antiga.
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
if('caches' in window){caches.keys().then(keys=>Promise.all(keys.filter(k=>k.indexOf('auto-gestio-')===0).map(k=>caches.delete(k)))).catch(()=>{});}
const KEY='autoGestioVehicles';
let vehicles=[];let edit=-1;let photoData='';
const $=id=>document.getElementById(id);
try{vehicles=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(vehicles))vehicles=[];}catch(e){vehicles=[];}
function save(){try{localStorage.setItem(KEY,JSON.stringify(vehicles));return true}catch(e){alert('No s’ha pogut guardar. L’emmagatzematge del navegador pot estar ple.');return false}}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function dateText(d){return d?new Date(d+'T12:00:00').toLocaleDateString('ca-ES'):'—'}
function dateStatus(d){if(!d)return '<span>—</span>';let n=Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000);if(n<0)return '<span class="bad">Vençut</span>';if(n<=30)return '<span class="warn">'+n+' dies</span>';return '<span class="ok">'+n+' dies</span>'}
function render(){let el=$('list');if(!vehicles.length){el.innerHTML='<div class="card empty">No tens cap vehicle.<br><br>Prem <b>＋ Afegir vehicle</b>.</div>';return;}el.innerHTML=vehicles.map((v,i)=>'<div class="card"><div class="vehicle"><img src="'+(v.photo||'grok_1792261932370.jpg')+'"><div><h3>'+esc(v.brand)+' '+esc(v.model)+'</h3><div class="muted">'+esc(v.type)+' · '+esc(v.plate||'Sense matrícula')+'</div><div class="tag">'+esc(v.eco||'Etiqueta pendent')+'</div></div></div><div class="grid"><div class="mini"><small>ITV</small><br>'+dateText(v.itv)+'<br>'+dateStatus(v.itv)+'</div><div class="mini"><small>Assegurança</small><br>'+dateText(v.insurance)+'<br>'+dateStatus(v.insurance)+'</div></div><div class="actions"><button data-view="'+i+'">Veure fitxa</button><button class="secondary" data-edit="'+i+'">Editar</button><button class="danger" data-del="'+i+'">Eliminar</button></div></div>').join('')}
function openForm(i){edit=i;let v=i>=0?vehicles[i]:{};$('formTitle').textContent=i>=0?'✏️ Editar vehicle':'➕ Afegir vehicle';$('form').classList.remove('hidden');$('detail').innerHTML='';$('type').value=v.type||'Cotxe';$('brand').value=v.brand||'';$('model').value=v.model||'';$('engine').value=v.engine||'';$('year').value=v.year||'';$('plate').value=v.plate||'';$('vin').value=v.vin||'';$('km').value=v.km??0;$('eco').value=v.eco||'';$('itv').value=v.itv||'';$('insurance').value=v.insurance||'';$('insuranceFrequency').value=v.insuranceFrequency||'annual';$('serviceKm').value=v.serviceKm||'';$('serviceDate').value=v.serviceDate||'';$('observations').value=v.observations||'';photoData=v.photo||'';$('preview').src=photoData;$('preview').classList.toggle('hidden',!photoData);$('form').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('brand').focus(),200)}
function closeForm(){edit=-1;photoData='';$('form').classList.add('hidden');$('vehicleForm').reset();$('km').value=0;$('preview').src='';$('preview').classList.add('hidden')}
$('add').onclick=()=>openForm(-1);$('cancel').onclick=closeForm;
$('photo').onchange=e=>{let f=e.target.files&&e.target.files[0];if(!f)return;if(f.size>4*1024*1024){alert('La foto ha de pesar menys de 4 MB.');e.target.value='';return}let r=new FileReader();r.onload=()=>{photoData=r.result;$('preview').src=photoData;$('preview').classList.remove('hidden')};r.readAsDataURL(f)};
$('vehicleForm').onsubmit=e=>{e.preventDefault();let v={type:$('type').value,brand:$('brand').value.trim(),model:$('model').value.trim(),engine:$('engine').value.trim(),year:$('year').value,plate:$('plate').value.trim().toUpperCase(),vin:$('vin').value.trim().toUpperCase(),km:Number($('km').value||0),eco:$('eco').value,itv:$('itv').value,insurance:$('insurance').value,insuranceFrequency:$('insuranceFrequency').value,serviceKm:Number($('serviceKm').value||0),serviceDate:$('serviceDate').value,observations:$('observations').value.trim(),photo:photoData};if(!v.brand||!v.model){alert('Has d’indicar marca i model.');return}if(edit>=0)vehicles[edit]=v;else vehicles.push(v);if(save()){closeForm();render();$('list').scrollIntoView({behavior:'smooth',block:'start'});}};
$('list').onclick=e=>{let b=e.target.closest('button');if(!b)return;let i=Number(b.dataset.view??b.dataset.edit??b.dataset.del);if(b.dataset.view!==undefined)detail(i);else if(b.dataset.edit!==undefined)openForm(i);else if(b.dataset.del!==undefined){if(confirm('Vols eliminar aquest vehicle?')){vehicles.splice(i,1);save();render();$('detail').innerHTML='';}}};
function detail(i){let v=vehicles[i];$('detail').innerHTML='<div class="card">'+(v.photo?'<img class="photo" src="'+v.photo+'">':'')+'<h2>🚗 '+esc(v.brand)+' '+esc(v.model)+'</h2><div class="status"><span>Tipus</span><b>'+esc(v.type)+'</b></div><div class="status"><span>Motor</span><b>'+esc(v.engine||'—')+'</b></div><div class="status"><span>Any</span><b>'+esc(v.year||'—')+'</b></div><div class="status"><span>Matrícula</span><b>'+esc(v.plate||'—')+'</b></div><div class="status"><span>VIN</span><b>'+esc(v.vin||'—')+'</b></div><div class="status"><span>Quilometratge</span><b>'+Number(v.km||0).toLocaleString('ca-ES')+' km</b></div><div class="status"><span>Etiqueta</span><b>'+esc(v.eco||'—')+'</b></div><div class="status"><span>ITV</span><b>'+dateText(v.itv)+' · '+dateStatus(v.itv)+'</b></div><div class="status"><span>Assegurança</span><b>'+dateText(v.insurance)+' · '+dateStatus(v.insurance)+'</b></div><div class="status"><span>Periodicitat</span><b>'+(v.insuranceFrequency==='monthly'?'Mensual':'Anual')+'</b></div><div class="status"><span>Pròxima revisió</span><b>'+(v.serviceKm||'—')+' km · '+dateText(v.serviceDate)+'</b></div><div class="obs"><b>📝 Observacions</b><br>'+esc(v.observations||'Sense observacions.')+'</div><div class="actions"><button data-edit-detail="'+i+'">✏️ Editar</button></div></div>';$('detail').scrollIntoView({behavior:'smooth',block:'start'})}
$('detail').onclick=e=>{let b=e.target.closest('[data-edit-detail]');if(b)openForm(Number(b.dataset.editDetail))};
render();
</script>
</body>
</html>
